<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Embedded M00 illustration</title>
  <desc id="desc">Stylized ATmega328P development board with LED and button.</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="board" x1="0" x2="1">
      <stop offset="0%" stop-color="#dfe7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="ledGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="140" y="140" width="920" height="500" rx="30" fill="url(#board)"/>

    <rect x="265" y="220" width="300" height="250" rx="20" fill="url(#chip)"/>
    <text x="415" y="355" font-size="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#e0f2fe" font-weight="700">ATmega328P</text>

    <g>
      <rect x="650" y="250" width="180" height="140" rx="18" fill="#111827" opacity="0.9"/>
      <circle cx="700" cy="320" r="36" fill="url(#ledGlow)"/>
      <circle cx="700" cy="320" r="18" fill="#fff7ed" opacity="0.9"/>
      <text x="760" y="332" font-size="34" font-family="Arial, Helvetica, sans-serif" fill="#0f172a" font-weight="700">LED</text>
      <path d="M670 390 H730" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
      <path d="M730 390 L770 390" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    </g>

    <g>
      <rect x="650" y="430" width="220" height="120" rx="18" fill="#f8fafc" opacity="0.9"/>
      <circle cx="700" cy="490" r="28" fill="#e2e8f0" stroke="#475569" stroke-width="8"/>
      <circle cx="700" cy="490" r="12" fill="#334155"/>
      <text x="760" y="500" font-size="34" font-family="Arial, Helvetica, sans-serif" fill="#0f172a" font-weight="700">BUTTON</text>
    </g>

    <g opacity="0.9">
      <rect x="210" y="540" width="760" height="26" rx="13" fill="#64748b"/>
    </g>
  </g>

  <g>
    <text x="600" y="90" text-anchor="middle" font-size="56" font-family="Arial, Helvetica, sans-serif" fill="#e2e8f0" font-weight="700">Embedded-M00</text>
    <text x="600" y="670" text-anchor="middle" font-size="28" font-family="Arial, Helvetica, sans-serif" fill="#cbd5e1">C embarqué • AVR • GPIO • debounce</text>
  </g>
</svg>
